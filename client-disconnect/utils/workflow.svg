<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <marker id="small-arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#8B949E" />
    </marker>
  </defs>

  <rect x="20" y="20" width="280" height="110" rx="12" fill="#2563EB" />
  <text x="160" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fetch Client Details</text>
  <text x="160" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#E0E7FF" text-anchor="middle">Retrieve site, connected device,</text>
  <text x="160" y="105" font-family="system-ui, sans-serif" font-size="14" fill="#E0E7FF" text-anchor="middle">and state via MAC address</text>

  <path d="M 320 75 L 420 75" stroke="#8B949E" stroke-width="4" fill="none" marker-end="url(#small-arrowhead)"/>

  <rect x="440" y="20" width="280" height="110" rx="12" fill="#2563EB" />
  <text x="580" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send Disconnect</text>
  <text x="580" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#E0E7FF" text-anchor="middle">Issue disconnect request to</text>
  <text x="580" y="105" font-family="system-ui, sans-serif" font-size="14" fill="#E0E7FF" text-anchor="middle">the device client is connected to</text>
</svg>