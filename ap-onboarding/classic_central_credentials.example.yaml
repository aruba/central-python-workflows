# Classic Central credentials for the same cluster as account_credentials.yaml.
# Create classic_central_credentials.yaml with mode 0600, replace every
# placeholder, and never commit the filled-in file.
central_info:
  base_url: <classic-central-base-url>
  token:
    access_token: <classic-central-access-token>
# TLS certificate verification. The pinned SDK reads this only at the
# document top level.
ssl_verify: true
