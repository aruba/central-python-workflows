# GreenLake platform + New Central credentials.
# Create account_credentials.yaml with mode 0600, replace every placeholder,
# and never commit the filled-in file.
unified:
  base_url: <central-cluster-api-base-url>
  client_id: <glp-client-id>
  client_secret: <glp-client-secret>
  workspace_id: <glp-workspace-id>
# TLS certificate verification. Keep this at the document top level.
ssl_verify: true
